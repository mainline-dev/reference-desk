name: Tests

on:
  push:
    branches: [master]

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3  # no moving v10 tag is published
      # The tests use only the standard library: no corpus, no model, no network
      # beyond fetching Python itself, so the project's dependencies are not installed.
      - name: Run the tests
        run: uv run --no-project --python 3.14 python -m unittest discover -s tests -v
