[project]
name = "reference-desk"
version = "0.1.0"
description = "Answers questions about continuous delivery practice from DORA, MinimumCD, Beyond MinimumCD and the Twelve-Factor App, quoting its sources and checking every quote."
readme = "README.md"
authors = [
    { name = "Nat Young", email = "1880813+natyoung@users.noreply.github.com" }
]
requires-python = ">=3.14"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "httpx>=0.28.1",
    "numpy>=2.5.5",
    "openai>=3.51.0",
    "python-dotenv>=1.2.4",
    "pyyaml>=6.0.3",
    "rank-bm25>=0.2.2",
    "sentence-transformers>=6.3.0",
    "transformers>=5.23.0",
]

[tool.uv]
package = false  # scripts, not an installable package
